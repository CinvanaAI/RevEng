[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reveng-control-center"
version = "0.2.0"
description = "Local-first Python repository analysis and capability orchestration system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.111",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
reveng = "reveng.cli:main"
reveng-desktop = "reveng.desktop.launcher:launch"

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
build = ["Pillow>=10.0", "pyinstaller>=6.0"]
dev = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["reveng*"]

[tool.setuptools]
include-package-data = true
