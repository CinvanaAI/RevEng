<div class="cap-env-surface-stack">
  <section class="cap-env-surface-card cap-env-surface-card--accent">
    <span class="cap-env-card-label">Draft Creation</span>
    <h3>Open the draft flow without leaving empty records behind</h3>
    <p>
      Opening this forge does not persist anything. The environment only creates a draft when you
      explicitly confirm the form below.
    </p>
  </section>

  <section class="cap-env-surface-card">
    <form id="forge-draft-form" class="cap-env-form" novalidate>
      <label class="cap-env-field">
        <span class="cap-env-field-label">Draft name</span>
        <input
          id="forge-name"
          name="name"
          type="text"
          value="New Draft"
          class="form-control"
          data-dirty-input
          required>
      </label>

      <label class="cap-env-field">
        <span class="cap-env-field-label">Description</span>
        <textarea
          id="forge-description"
          name="description"
          rows="5"
          class="form-control"
          placeholder="Describe the workshop change this draft is intended to explore."
          data-dirty-input></textarea>
      </label>

      <div id="forge-error" class="cap-env-inline-error" hidden></div>

      <div class="cap-env-form-actions">
        <button type="submit" id="forge-submit" class="btn btn-primary">Create Draft</button>
        <a href="{{ close_surface_href }}" class="btn" data-cap-env-leave="true">Cancel</a>
      </div>
    </form>
  </section>
</div>
